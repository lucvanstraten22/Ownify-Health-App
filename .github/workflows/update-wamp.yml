name: Update WAMP

on:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: self-hosted

    permissions:
      contents: read

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Copy files to WAMP
        shell: cmd
        run: |
          robocopy "%GITHUB_WORKSPACE%" "C:\wamp64\www\Ownify" /MIR /XD ".git" "uploads" /XF "*.local.php"
          if %ERRORLEVEL% GTR 7 exit /b %ERRORLEVEL%
          rem config\*.local.php (the database password, the Gemini API key) are
          rem git-ignored and never in the checkout: excluded, the mirror leaves
          rem the copies on this machine alone instead of deleting them.
          rem uploads\ is left out of the mirror so nobody's avatar is deleted,
          rem but its .htaccess (never run anything uploaded) must always be there.
          robocopy "%GITHUB_WORKSPACE%\uploads" "C:\wamp64\www\Ownify\uploads" .htaccess
          if %ERRORLEVEL% LEQ 7 exit /b 0
          exit /b %ERRORLEVEL%

      - name: Verify deployed commit
        shell: cmd
        run: |
          echo GitHub commit:
          echo %GITHUB_SHA%
