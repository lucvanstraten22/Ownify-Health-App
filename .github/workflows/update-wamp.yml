name: Update WAMP

on:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: self-hosted

    permissions:
      contents: read

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Copy files to WAMP
        shell: cmd
        run: |
          robocopy "%GITHUB_WORKSPACE%" "C:\wamp64\www\JoLu" /MIR /XD ".git" "uploads"
          if %ERRORLEVEL% LEQ 7 exit /b 0
          exit /b %ERRORLEVEL%

      - name: Verify deployed commit
        shell: cmd
        run: |
          echo GitHub commit:
          echo %GITHUB_SHA%
