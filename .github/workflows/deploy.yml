name: Deploy Health Preview

on:
  push:
    branches:
      - main

concurrency:
  group: health-preview-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Hestia
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Writes which commit is being uploaded, so the live site can say what
      # it is running. Without it, "did my change reach the server?" can only
      # be answered by guessing, and a stale deploy looks exactly like a bug.
      - name: Stamp the build
        run: |
          printf '%s' "${GITHUB_SHA}" > VERSION
          echo "Stamped VERSION with ${GITHUB_SHA}"

      # The Android project is in the repository for development, not for the
      # website. Only its .htaccess (deny all) is uploaded: nginx on Hestia
      # serves .xml, .webp and .jar itself, so an .htaccess alone cannot keep
      # those private — they must not reach the server at all.
      - name: Leave the Android project out of the upload
        run: |
          find HealthappAndroid -mindepth 1 ! -path HealthappAndroid/.htaccess -delete
          ls -A HealthappAndroid

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_SERVER }}
          port: 22
          ssh_private_key: ${{ secrets.SFTP_PRIVATE_KEY }}
          local_path: './*'
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
          sftp_only: true