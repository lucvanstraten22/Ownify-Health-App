name: Deploy Ownify

on:
  push:
    branches:
      - main
  # Run by hand from the Actions tab (Deploy Ownify → Run workflow): the same
  # deploy, and, when an address is given, one real test e-mail sent from
  # the website after the mail password is in place (docs/MAIL.md).
  workflow_dispatch:
    inputs:
      mail_test_to:
        description: 'Send a test e-mail to this address after deploying (empty: no test)'
        required: false
        default: ''
      mail_location:
        description: 'Where the mail password goes: private (outside the web root, recommended) or config (only if private/ cannot be used)'
        required: true
        default: private
        type: choice
        options:
          - private
          - config

concurrency:
  group: ownify-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Hestia
    runs-on: ubuntu-latest
    env:
      # Only whether it is set — a secret's value cannot be used in `if:`.
      HAS_MAIL_PASSWORD: ${{ secrets.OWNIFY_MAIL_APP_PASSWORD != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Writes which commit is being uploaded, so the live site can say what
      # it is running. Without it, "did my change reach the server?" can only
      # be answered by guessing, and a stale deploy looks exactly like a bug.
      - name: Stamp the build
        run: |
          printf '%s' "${GITHUB_SHA}" > VERSION
          echo "Stamped VERSION with ${GITHUB_SHA}"

      # The Android project is in the repository for development, not for the
      # website. Only its .htaccess (deny all) is uploaded: nginx on Hestia
      # serves .xml, .webp and .jar itself, so an .htaccess alone cannot keep
      # those private — they must not reach the server at all.
      - name: Leave the Android project out of the upload
        run: |
          find OwnifyAndroid -mindepth 1 ! -path OwnifyAndroid/.htaccess -delete
          ls -A OwnifyAndroid

      # The same for the database scripts (schema, migrations, the dev seed
      # with its published dev password) and the developer docs: they are
      # for people setting up a database or reading the code, and the app
      # never reads them. Their .htaccess (deny all) goes up, so the copies
      # uploaded before this are refused by Apache too.
      - name: Leave the database scripts and docs out of the upload
        run: |
          for dir in database docs; do
            find "$dir" -mindepth 1 ! -path "$dir/.htaccess" -delete
            ls -A "$dir"
          done

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_SERVER }}
          port: 22
          ssh_private_key: ${{ secrets.SFTP_PRIVATE_KEY }}
          local_path: './*'
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
          sftp_only: true

      # The Gmail App Password (docs/MAIL.md), from the GitHub Actions secret
      # OWNIFY_MAIL_APP_PASSWORD, over the same SFTP login: written to
      # private/mail.local.php beside public_html (the folder 700, the file
      # 600), checked afterwards, never printed. It is never in the checkout,
      # so the upload above can neither carry nor overwrite it, and nothing
      # here deletes it. Without the secret this is skipped.
      - name: Put the mail password on the server
        if: env.HAS_MAIL_PASSWORD == 'true'
        env:
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
          OWNIFY_MAIL_APP_PASSWORD: ${{ secrets.OWNIFY_MAIL_APP_PASSWORD }}
          MAIL_LOCATION: ${{ inputs.mail_location || 'private' }}
        run: bash .github/scripts/mail-provision.sh

      - name: No mail password yet
        if: env.HAS_MAIL_PASSWORD != 'true'
        run: echo "::notice title=Mail::The secret OWNIFY_MAIL_APP_PASSWORD is not set, so no mail password was put on the server (docs/MAIL.md)."

      # Run by hand with an address: one real message, sent by the website
      # itself through a one-time file that removes itself (the SFTP login
      # has no shell for tools/mail-test.php).
      - name: Send a test e-mail from the website
        if: github.event_name == 'workflow_dispatch' && inputs.mail_test_to != ''
        env:
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
          MAIL_TEST_TO: ${{ inputs.mail_test_to }}
        run: bash .github/scripts/mail-test.sh
