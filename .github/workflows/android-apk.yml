name: Build Ownify Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: OwnifyAndroid

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ownify-release.jks"

      - name: Set version
        run: |
          VERSION="13.1.${GITHUB_RUN_NUMBER}"
          echo "OWNIFY_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "OWNIFY_VERSION_CODE=$((30 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/ownify-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ownify-release-apk
          path: OwnifyAndroid/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${OWNIFY_VERSION_NAME}" \
            app/build/outputs/apk/release/app-release.apk \
            --title "Ownify 13.1 (Build ${OWNIFY_VERSION_CODE})" \
            --generate-notes
